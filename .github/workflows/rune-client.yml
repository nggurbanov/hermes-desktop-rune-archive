name: Native Rune client
on:
  push:
    branches: [main, feat/standalone-desktop]
    paths: ['apps/rune/**', '.github/workflows/rune-client.yml']
  pull_request:
    paths: ['apps/rune/**', '.github/workflows/rune-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers \
            libasound2-dev libwebkit2gtk-4.1-dev libopus-dev cmake meson ninja-build \
            libclang-dev llvm dbus-daemon xvfb
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component llvm-tools-preview
      - name: Verify pinned Rune source and patch provenance
        run: python3 apps/rune/vendor/rune/scripts/verify-hermes-source.py
      - name: Check formatting
        run: cargo +1.95.0 fmt --manifest-path apps/rune/Cargo.toml --check
      - name: Test native contracts
        run: cargo +1.95.0 test --locked --manifest-path apps/rune/Cargo.toml
      - name: Build native client
        run: cargo +1.95.0 build --locked --manifest-path apps/rune/Cargo.toml
      - name: Check synthetic native scenes and interactions
        run: node apps/rune/scripts/check-scenes.mjs
      - name: Check composer and model picker interactions
        run: node apps/rune/scripts/check-composer.mjs
      - name: Check independent editor ownership
        run: node apps/rune/scripts/check-editors.mjs
      - name: Check native client settings
        run: node apps/rune/scripts/check-client-settings.mjs
      - name: Check native feature pages
        run: node apps/rune/scripts/check-pages.mjs
