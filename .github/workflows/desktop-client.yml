name: Standalone desktop client

on:
  push:
    branches: [main, feat/standalone-desktop]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'scripts/build/**'
      - 'package*.json'
      - 'eslint.config.shared.mjs'
      - '.npmrc'
      - '.github/workflows/desktop-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - name: Prepare npm and desktop native headers
        run: |
          npm install --global npm@12.0.2
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev
      - name: Export client sources without any agent source or Python environment
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-client"
          git archive HEAD apps/desktop apps/shared package.json package-lock.json \
            .npmrc eslint.config.shared.mjs LICENSE \
            scripts/build/desktop.mjs scripts/build/frontend-common.mjs \
            scripts/build/freshness.mjs scripts/build/node-deps.mjs \
            scripts/build/electron-runtime.mjs scripts/build/webapp.mjs \
            | tar -x -C "$RUNNER_TEMP/desktop-client"
      - name: Install only the client workspace graph
        working-directory: ${{ runner.temp }}/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Typecheck desktop, shared client, E2E fixtures and packaging
        working-directory: ${{ runner.temp }}/desktop-client
        run: |
          npm run typecheck
          npm exec --workspace apps/desktop -- tsc -p tsconfig.external.json --noEmit
      - name: Verify extraction contracts
        working-directory: ${{ runner.temp }}/desktop-client
        run: >-
          npm exec --workspace apps/desktop -- vitest run --project electron
          scripts/desktop-build-inputs.test.mjs scripts/standalone-packaging.test.mjs
          electron/external-runtime.test.ts electron/updater/standalone.test.ts
          e2e/external-runtime.unit.test.ts
      - name: Compile desktop without an agent tree
        working-directory: ${{ runner.temp }}/desktop-client
        run: npm run build
