name: Standalone desktop client

on:
  push:
    branches: [main, feat/standalone-desktop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - name: Prepare npm and desktop native headers
        run: |
          npm install --global npm@12.0.2
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev
      - run: npm ci --no-audit --no-fund
      - name: Typecheck desktop, shared client and test fixtures
        run: |
          npm run typecheck
          npm exec --workspace apps/desktop -- tsc -p tsconfig.external.json --noEmit
      - name: Build and inspect standalone Linux package
        run: |
          npm run pack
          npm run test:package --workspace apps/desktop

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ui
            shard: 1/4
          - project: ui
            shard: 2/4
          - project: ui
            shard: 3/4
          - project: ui
            shard: 4/4
          - project: electron
            shard: 1/1
    name: Tests (${{ matrix.project }}, ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - run: npm install --global npm@12.0.2
      - run: npm ci --no-audit --no-fund
      - name: Run client tests without an agent installation
        run: >-
          npm exec --workspace apps/desktop -- vitest run
          --project ${{ matrix.project }} --shard ${{ matrix.shard }}
