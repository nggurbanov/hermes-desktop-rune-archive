[package]
name = "hermes-rune"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bfb8facae2e4665e5e6d17afe85561884a7fd402", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "bfb8facae2e4665e5e6d17afe85561884a7fd402", features = ["markdown", "mermaid"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "bfb8facae2e4665e5e6d17afe85561884a7fd402" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
regex = "1"
webrtc = "0.14"
opus = "0.4"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
portable-pty = "0.9"
vt100 = "0.16"
rfd = "0.15"
ignore = "0.4"
trash = "5.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = "=0.45.1"
cpal = "0.16"
rodio = "0.21.1"
hound = "3.5"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
qrcodegen = "1.8"
wry = "0.57.1"
tao = "0.37.2"
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
futures-util = { version = ">=0.3.32,<0.4", default-features = false, features = ["std", "async-await"] }
webrtc-audio-processing = { version = "2.1", default-features = false, features = ["bundled"] }
gtk = "0.18"
rustix = { version = "1", features = ["net", "process", "fs"] }
webkit2gtk = { version = "2", features = ["v2_40"] }

[profile.dev.package."*"]
debug = false

[build-dependencies]
cc = "=1.10.0"

[patch.crates-io]
symphonia-core = { path = "vendor/symphonia-core" }
symphonia-metadata = { path = "vendor/symphonia-metadata" }
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }

[dev-dependencies]
symphonia-metadata = "=0.5.5"
